<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Teren</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0C0E;color:#F2F4F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px}
  .card{max-width:420px;width:100%;background:#15171B;border:1px solid #262A30;border-radius:16px;padding:32px 28px;text-align:center}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#A8AEB8;line-height:1.5;font-size:15px}
  ol{text-align:left;color:#A8AEB8;line-height:1.7;font-size:15px;padding-left:20px}
  a.btn{display:block;margin-top:12px;padding:14px;border-radius:10px;font-weight:700;text-decoration:none}
  .primary{background:#CBFF3C;color:#14160C}
  .secondary{background:#262A30;color:#F2F4F7}
</style>
</head>
<body>
<div class="card">
  <h1>Join your team on Teren</h1>
  <p id="msg">To create your account, you need the Teren app on your phone.</p>
  <ol>
    <li>Install the Teren app</li>
    <li>Come back to your invite email and tap <b>Create my account</b> again</li>
  </ol>
  <a id="open" class="btn primary" href="#">I have the app — open it</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.teren.app">Get Teren on Android</a>
</div>
<script>
  var m = location.pathname.match(/^\/invite\/([0-9a-fA-F-]{36})/);
  if (m) {
    document.getElementById('open').href = 'teren://invite/' + m[1];
  } else {
    document.getElementById('open').style.display = 'none';
    document.getElementById('msg').textContent = "This page doesn't exist. If you were sent an invite, please use the link in your email.";
  }
</script>
</body>
</html>
